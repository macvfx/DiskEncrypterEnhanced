name: DiskEncrypterAccess
options:
  bundleIdPrefix: com.macvfx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
targets:
  Disk Encrypter Access:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: Helper/ProtectedExceptionStore.swift
      - path: Resources/com.macvfx.DiskEncrypterAccess.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: Disk Encrypter Access Helper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LaunchServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macvfx.DiskEncrypterAccess
        PRODUCT_NAME: Disk Encrypter Access
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Disk Encrypter Access
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      testTargets:
        - Disk Encrypter AccessTests
        - Disk Encrypter Access HelperTests
  Disk Encrypter Access Helper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
      - path: Core/AdminEligibility.swift
      - path: Core/DiskutilVolumeDiscovery.swift
      - path: Core/ExceptionModels.swift
      - path: Core/ExternalVolume.swift
      - path: Core/HelperXPCProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macvfx.DiskEncrypterAccess.Helper
        PRODUCT_NAME: com.macvfx.DiskEncrypterAccess.Helper
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  Disk Encrypter AccessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Disk Encrypter Access
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macvfx.DiskEncrypterAccessTests
        GENERATE_INFOPLIST_FILE: YES
  Disk Encrypter Access HelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HelperTests
      - path: Helper/DiskMutationController.swift
      - path: Helper/ExceptionManager.swift
      - path: Helper/ProtectedExceptionStore.swift
      - path: Core/DiskutilVolumeDiscovery.swift
      - path: Core/ExceptionModels.swift
      - path: Core/ExternalVolume.swift
      - path: Core/HelperXPCProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macvfx.DiskEncrypterAccessHelperTests
        GENERATE_INFOPLIST_FILE: YES
